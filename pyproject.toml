[project]
name = "astrbot-plugin-zhiren-leaderboard"
version = "1.7.5"
description = "智人排行榜 — AstrBot 群聊记分、AI 裁判、自我迭代与内置 Web 排行榜插件"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # 提示词长中文字符串允许自然换行控制
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
